<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flask Login{% endblock %}</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --ink:#1d2433; --muted:#6b7385; --accent:#2f6fed; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink);
           min-height:100vh; display:grid; place-items:center; padding:16px; }
    .card { background:var(--card); padding:32px; border-radius:12px; width:100%; max-width:380px;
            box-shadow:0 8px 30px rgba(0,0,0,.06); }
    h1 { margin:0 0 20px; font-size:1.4rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
    input[type=text], input[type=password] { width:100%; padding:10px; border:1px solid #d5d9e3; border-radius:8px; font-size:1rem; }
    button { margin-top:18px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font-size:1rem; cursor:pointer; }
    .flash { padding:10px; border-radius:8px; margin-bottom:10px; font-size:.9rem; }
    .flash.danger { background:#fdecec; color:#a32020; }
    .flash.success { background:#e8f7ee; color:#1c6b3a; }
    .flash.info { background:#e9f0fe; color:#1f4fb5; }
    .muted { color:var(--muted); font-size:.9rem; margin-top:16px; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
