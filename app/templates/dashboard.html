{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Welcome, {{ user.username }}</h1>
<p>You're logged in. This session is backed by MySQL running in its own container.</p>
<p class="muted">Member since {{ user.created_at.strftime('%d %b %Y') }}</p>
<p><a href="{{ url_for('auth.logout') }}">Log out</a></p>
{% endblock %}
